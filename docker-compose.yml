services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sh-fire-risk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fire_risk_dashboard
      POSTGRES_USER: fire_risk
      POSTGRES_PASSWORD: fire_risk_local
    ports:
      - "5432:5432"
    volumes:
      - fire-risk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire_risk -d fire_risk_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fire-risk-postgres:
